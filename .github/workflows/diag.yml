name: Diag

# Temporary: prints the real geometry of a scaled SettingsDialog on a runner.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the core dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Probe the window geometry
        run: python tools/diag_dpi.py
